<style>
  /* Layout: one narrow column. The business card face comes first, then the save action, quick contact, socials. */
  :root {
    --bg: #FFFFFF;
    --surface: #FFFBEB;        /* amber-50 */
    --line: #E5E7EB;           /* gray-200 */
    --text: #4B5563;           /* gray-600 */
    --ink: #111827;            /* gray-900 */
    --accent: #F59E0B;         /* amber-500 */
    --accent-strong: #D97706;  /* amber-600 */
    --accent-soft: #FDE68A;    /* amber-200 */
    --on-accent: #1F1300;
    --card-a: #FFF7DB;
    --card-b: #FDE7A9;
    --card-ink: #3A2600;
    --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14110B; --surface: #1D1810; --line: #33291A; --text: #C9BFAE; --ink: #F7F1E5;
      --accent: #F59E0B; --accent-strong: #FBBF24; --accent-soft: #5A3F0E; --on-accent: #1F1300;
      --card-a: #2A2112; --card-b: #3D2C0E; --card-ink: #FCE7B2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14110B; --surface: #1D1810; --line: #33291A; --text: #C9BFAE; --ink: #F7F1E5;
    --accent: #F59E0B; --accent-strong: #FBBF24; --accent-soft: #5A3F0E; --on-accent: #1F1300;
    --card-a: #2A2112; --card-b: #3D2C0E; --card-ink: #FCE7B2;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---- Card face ---- */
  .card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    padding: 22px 22px 20px;
    color: var(--card-ink);
    background:
      radial-gradient(120% 90% at 100% 0%, var(--card-b) 0%, transparent 60%),
      linear-gradient(160deg, var(--card-a), var(--card-b));
    border: 1px solid var(--accent-soft);
    box-shadow: 0 18px 40px -22px rgba(217, 119, 6, .55), 0 2px 6px -2px rgba(17, 24, 39, .08);
    aspect-ratio: 1.75 / 1;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    animation: pop .7s cubic-bezier(.2, .9, .25, 1.15) both;
  }

  .logo-bg {
    position: absolute;
    right: -22px;
    bottom: -40px;
    width: 150px;
    height: 212px;
    color: var(--accent);
    opacity: .24;
    animation: bloom 1.2s cubic-bezier(.2, .8, .2, 1) both;
    pointer-events: none;
  }
  .card-top { display: flex; align-items: center; gap: 8px; margin: -6px 0 0 -4px; }
  .mark { width: 30px; height: 42px; color: var(--accent-strong); flex: none; }
  .brand {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .name {
    margin-top: auto;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 8.4vw, 36px);
    line-height: 1.05;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .role { margin-top: 6px; font-size: 14px; font-weight: 500; opacity: .85; }
  .coords {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    font-size: 11.5px;
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    opacity: .75;
    position: relative;
  }

  /* ---- Save ---- */
  .save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 56px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    font-size: 17px;
    text-decoration: none;
    box-shadow: 0 10px 24px -12px rgba(217, 119, 6, .9);
    transition: transform .15s ease, background .15s ease;
    animation: rise .6s .15s ease-out both;
  }
  .save:hover { background: var(--accent-strong); }
  .save:active { transform: scale(.98); }
  .save svg { width: 20px; height: 20px; }
  .save-note { margin-top: -8px; text-align: center; font-size: 13px; }

  /* ---- Quick contact ---- */
  .quick {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 10px;
    animation: rise .6s .22s ease-out both;
  }
  .quick a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 8px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    transition: border-color .15s ease, background .15s ease;
  }
  .quick a:hover { border-color: var(--accent); background: var(--surface); }
  .quick svg { width: 22px; height: 22px; color: var(--accent-strong); }

  /* ---- Links ---- */
  .label {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text);
    margin: 6px 2px -6px;
  }
  .links {
    list-style: none;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    animation: rise .6s .3s ease-out both;
  }
  .links li + li { border-top: 1px solid var(--line); }
  .links a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    color: var(--ink);
    text-decoration: none;
    transition: background .15s ease;
  }
  .links a:hover { background: var(--surface); }
  .ico {
    width: 38px; height: 38px; flex: none;
    display: grid; place-items: center;
    border-radius: 10px;
    background: var(--surface);
    color: var(--accent-strong);
  }
  .ico svg { width: 20px; height: 20px; }
  .txt { min-width: 0; flex: 1; }
  .t { display: block; font-weight: 600; font-size: 15.5px; }
  .s { display: block; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arrow { width: 18px; height: 18px; color: var(--text); flex: none; transition: transform .15s ease, color .15s ease; }
  .links a:hover .arrow { transform: translateX(3px); color: var(--accent-strong); }

  /* ---- Share + footer ---- */
  .share {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px;
    border: 1px dashed var(--accent);
    border-radius: 14px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .share:hover { background: var(--surface); }
  .share svg { width: 18px; height: 18px; color: var(--accent-strong); }
  footer { text-align: center; font-size: 12.5px; padding-top: 4px; }
  footer p + p { margin-top: 2px; opacity: .8; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  @keyframes pop { from { opacity: .4; transform: translateY(14px) scale(.94) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: .3; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes bloom { from { transform: translateY(16px) scale(.86); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  <ul class="links" id="links"></ul>

  <button class="share" id="share" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>
    Pass this card along
  </button>

  <footer>
    <p>© <span id="year">2026</span> Daniel Stewart · Explorerpreneur</p>
    <p>You tapped the card. Good instincts.</p>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   EDIT THIS BLOCK. If you change contact details, also update
   Daniel-Stewart.vcf (or ask Claude to regenerate it). Everything on the page and in the saved
   contact comes from here. Leave a value as "" to hide it.
   ========================================================= */
const CONTACT = {
  firstName: "Daniel",
  lastName:  "Stewart",
  title:     "Writer · Builder · Investor",
  org:       "Explorerpreneur",
  phone:     "+1 343 552 7378",
  email:     "daniel.stewarrt@gmail.com",
  city:      "Vancouver",
  region:    "BC",
  country:   "Canada",
  note:      "Met via my NFC card. Writer, builder, investor. Author of Trying New Things.",
  socials: [
    { key: "youtube",   label: "YouTube",            sub: "@explorerpreneur",          url: "https://www.youtube.com/@explorerpreneur" },
    { key: "instagram", label: "Instagram",          sub: "@explorerpreneur",          url: "https://www.instagram.com/explorerpreneur" },
    { key: "linkedin",  label: "LinkedIn",           sub: "Let's connect",             url: "https://www.linkedin.com/in/danthemans" },
    { key: "book",      label: "Trying New Things",  sub: "My book on Amazon",         url: "https://www.amazon.com/stores/Daniel-Stewart/author/B0DTB5F4YY" },
    { key: "coin",      label: "Gold & Silver Portfolio", sub: "goldsilverportfolio.com", url: "https://www.goldsilverportfolio.com/" }
  ]
};
/* ========================================================= */

const ICONS = {
  youtube:   '<path d="M22.5 6.4a2.8 2.8 0 0 0-2-2C18.9 4 12 4 12 4s-6.9 0-8.6.5a2.8 2.8 0 0 0-1.9 2A29 29 0 0 0 1 11.8a29 29 0 0 0 .5 5.3 2.8 2.8 0 0 0 1.9 2c1.7.5 8.6.5 8.6.5s6.9 0 8.6-.5a2.8 2.8 0 0 0 1.9-2 29 29 0 0 0 .5-5.3 29 29 0 0 0-.5-5.4z"/><path d="m9.8 15 5.7-3.2-5.7-3.3z" fill="currentColor" stroke="none"/>',
  instagram: '<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>',
  linkedin:  '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
  book:      '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h7"/><path d="M8 11h5"/>',
  coin:      '<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.5-.5-3-1.5"/>',
  phone:     '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  text:      '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  mail:      '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  arrow:     '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>'
};
const svg = (k, cls = "") =>
  `<svg ${cls ? `class="${cls}"` : ""} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;

const fullName = `${CONTACT.firstName} ${CONTACT.lastName}`.trim();
const telHref = CONTACT.phone.replace(/[^\d+]/g, "");
const liveSocials = CONTACT.socials.filter(s => s.url);

/* Card text */
document.getElementById("name").textContent = fullName;
document.getElementById("role").textContent = CONTACT.title;
document.getElementById("city").textContent = [CONTACT.city, CONTACT.region].filter(Boolean).join(", ");
document.getElementById("year").textContent = new Date().getFullYear();

/* Quick contact buttons */
const quick = [];
if (CONTACT.phone) {
  quick.push(`<a href="tel:${telHref}">${svg("phone")}Call</a>`);
  quick.push(`<a href="sms:${telHref}">${svg("text")}Text</a>`);
}
if (CONTACT.email) quick.push(`<a href="mailto:${CONTACT.email}">${svg("mail")}Email</a>`);
const quickEl = document.getElementById("quick");
quickEl.innerHTML = quick.join("");
quickEl.hidden = quick.length === 0;

/* Link list */
document.getElementById("links").innerHTML = liveSocials.map(s => `
  <li><a href="${s.url}" target="_blank" rel="noopener">
    <span class="ico">${svg(s.key)}</span>
    <span class="txt"><span class="t">${s.label}</span><span class="s">${s.sub}</span></span>
    ${svg("arrow", "arrow")}
  </a></li>`).join("");

/* vCard 3.0, built from CONTACT */
function esc(v) { return String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;"); }
function buildVCard() {
  const L = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${esc(CONTACT.lastName)};${esc(CONTACT.firstName)};;;`,
    `FN:${esc(fullName)}`
  ];
  if (CONTACT.org)   L.push(`ORG:${esc(CONTACT.org)}`);
  if (CONTACT.title) L.push(`TITLE:${esc(CONTACT.title)}`);
  if (CONTACT.phone) L.push(`TEL;TYPE=CELL,VOICE:${telHref}`);
  if (CONTACT.email) L.push(`EMAIL;TYPE=INTERNET,PREF:${CONTACT.email}`);
  if (CONTACT.city || CONTACT.region || CONTACT.country)
    L.push(`ADR;TYPE=WORK:;;;${esc(CONTACT.city)};${esc(CONTACT.region)};;${esc(CONTACT.country)}`);
  liveSocials.forEach((s, i) => {
    const n = i + 1;
    L.push(`item${n}.URL:${s.url}`);
    L.push(`item${n}.X-ABLabel:${esc(s.label)}`);
    if (["youtube", "instagram", "linkedin"].includes(s.key))
      L.push(`X-SOCIALPROFILE;TYPE=${s.key}:${s.url}`);
  });
  if (CONTACT.note) L.push(`NOTE:${esc(CONTACT.note)}`);
  L.push(`REV:${new Date().toISOString()}`);
  L.push("END:VCARD");
  return L.join("\r\n") + "\r\n";
}
/* The Save button links to Daniel-Stewart.vcf, hosted next to this page.
   iPhones open a hosted .vcf straight into "Add to Contacts". If that file
   is missing (for example when you open this page from your computer),
   fall back to a contact built from CONTACT above. */
const save = document.getElementById("save");
if (location.protocol === "file:") {
  save.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(buildVCard());
  save.download = `${CONTACT.firstName}-${CONTACT.lastName}.vcf`;
}

/* Android downloads contact files instead of opening them, so say so up front. */
const isAndroid = /Android/i.test(navigator.userAgent);
if (isAndroid) {
  document.querySelector(".save-note").textContent =
    "Your phone will download a contact file. Tap it to add me to Contacts.";
  save.addEventListener("click", () => {
    setTimeout(() => toast("Tap the download to add me to Contacts"), 600);
  });
}

/* Toast */
const toastEl = document.getElementById("toast");
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* Share this page */
document.getElementById("share").addEventListener("click", async () => {
  const data = { title: `${fullName} · ${CONTACT.org}`, text: `${fullName}'s contact card`, url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    await navigator.clipboard.writeText(location.href);
    toast("Link copied");
  } catch {
    toast(location.href);
  }
});
</script>
</body>
</html>
